[project]
name = "brewnotes"
version = "0.1.0"
description = "Triaged TL;DR of release notes for your Homebrew updates"
requires-python = ">=3.12"
dependencies = [
    "rich>=13",
    "anthropic>=1.0",
]

[project.scripts]
brewnotes = "brewnotes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["C901", "I", "UP", "B"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
